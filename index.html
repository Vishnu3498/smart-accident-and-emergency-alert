<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Accident Emergency Alert System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #d32f2f;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px auto;
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        button {
            padding: 12px 20px;
            background: #d32f2f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #b71c1c;
        }

        #map {
            width: 100%;
            height: 400px;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>🚨 Smart Accident Emergency Alert System</h1>

    <div class="card">

        <h2>Accident Detection</h2>

        <p id="status">No accident detected</p>

        <button onclick="detectAccident()">
            Simulate Accident
        </button>

    </div>

    <div class="card">

        <h2>📍 Accident Location</h2>

        <p id="location">Location not detected</p>

        <div id="map"></div>

    </div>

    <script>

        function detectAccident() {

            document.getElementById("status").innerHTML =
                "⚠️ Accident Detected!";

            if (navigator.geolocation) {

                navigator.geolocation.getCurrentPosition(
                    showLocation,
                    showError
                );

            } else {

                document.getElementById("location").innerHTML =
                    "Geolocation is not supported.";

            }
        }

        function showLocation(position) {

            let latitude = position.coords.latitude;
            let longitude = position.coords.longitude;

            document.getElementById("location").innerHTML =
                "Latitude: " + latitude +
                "<br>Longitude: " + longitude;

            let mapURL =
                "https://www.google.com/maps?q=" +
                latitude + "," + longitude;

            document.getElementById("map").innerHTML =
                '<iframe src="' + mapURL + '&output=embed" ' +
                'width="100%" height="400" style="border:0;" ' +
                'allowfullscreen loading="lazy"></iframe>';
        }

        function showError(error) {

            document.getElementById("location").innerHTML =
                "Location permission denied or unavailable.";
        }

    </script>

</body>
</html>
